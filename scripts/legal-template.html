<style>

:root{--encre:#0F1E2E;--bleu:#1A5FA8;--laiton:#C29A5B;--text2:#4F5E6D;--border:#E3E9EF;--bg2:#F4F7FA}
body{font-family:'Inter',system-ui,sans-serif;color:var(--encre);background:#fff;line-height:1.7;-webkit-font-smoothing:antialiased}
a{color:var(--bleu)}

.back{color:#B9C6D2;font-size:14px;text-decoration:none}
.back:hover{color:#fff}
.tabs{max-width:860px;margin:0 auto;display:flex;gap:6px;flex-wrap:wrap;padding:28px 16px 0}
.tabs a{font-size:13.5px;text-decoration:none;color:var(--text2);border:1px solid var(--border);border-radius:999px;padding:6px 14px}
.tabs a[aria-current]{background:var(--encre);border-color:var(--encre);color:#fff}
main{max-width:860px;margin:0 auto;padding:28px 16px 80px}
h1{font-family:'Bricolage Grotesque',sans-serif;font-size:clamp(26px,4vw,36px);line-height:1.15;letter-spacing:-.5px;margin-bottom:8px}
h1+p{color:var(--text2);font-size:14px;margin-bottom:28px}
h2{font-size:19px;margin:34px 0 10px;padding-top:6px}
h3{font-size:16px;margin:22px 0 8px}
p{color:var(--text2);margin-bottom:12px;font-size:15.5px}
p strong{color:var(--encre)}
mark{background:#FFF1C2;color:#7A5A00;padding:0 3px;border-radius:3px}
.table{overflow-x:auto;margin:14px 0 18px;border:1px solid var(--border);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:14px;min-width:520px}
th,td{text-align:left;padding:10px 14px;border-top:1px solid var(--border);vertical-align:top}
th{background:var(--bg2);border-top:none;font-weight:600}
td{color:var(--text2)}
footer{border-top:1px solid var(--border);padding:24px 16px;text-align:center;font-size:13px;color:var(--text2)}
